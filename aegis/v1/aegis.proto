syntax = "proto3";

package aegis.v1;

option go_package = "github.com/yourusername/aegis-proto/aegis/v1;aegisv1";

import "google/protobuf/timestamp.proto";

// ═══════════════════════════════════════════════════════════════════════════
// Aegis Agent → Control Plane Protocol
//
// The agent initiates one bidirectional stream per node.
// All messages from the agent are wrapped in AgentMessage.
// All messages from the control plane are wrapped in ControlPlaneMessage.
//
// Stream lifecycle:
//   1. Agent dials control plane (mTLS)
//   2. Agent sends AgentMessage{connect}
//   3. Control plane validates cluster_id, registers node
//   4. Agent sends AgentMessage{snapshot} — full current state
//   5. Agent sends AgentMessage{event} as things happen
//   6. Agent sends AgentMessage{heartbeat} every 10 seconds
//   7. On disconnect: control plane marks node offline after heartbeat timeout
// ═══════════════════════════════════════════════════════════════════════════


// ── Top-level message wrappers ────────────────────────────────────────────

// Every message from agent to control plane is wrapped here.
// The oneof ensures exactly one payload per message.
message AgentMessage {
  // Identifies which node sent this message.
  // Repeated on every message so the control plane never loses context
  // even if messages arrive out of order on reconnect.
  string cluster_id  = 1;
  string node_name   = 2;

  oneof payload {
    Connect          connect   = 3;
    Heartbeat        heartbeat = 4;
    StateSnapshot    snapshot  = 5;
    ServiceMapEvent  svc_event = 6;
    SignalEvent      sig_event = 7;
    ServiceMapBatch  svc_batch = 8;
    EndpointAdvertisement  endpoints  = 9;
    DnsObservation         dns_obs    = 10;
    WorkloadEvent          wl_event   = 11;
  }
}

// Every message from control plane to agent is wrapped here.
// Reserved for future use — config updates, acknowledged events, etc.
message ControlPlaneMessage {
  oneof payload {
    ConnectAck   connect_ack = 1;
    ConfigUpdate config      = 2;
  }
}


// ── Connection lifecycle ──────────────────────────────────────────────────

// First message sent by the agent after the stream is established.
// Control plane uses this to register the node and validate cluster_id.
message Connect {
  string agent_version  = 1;  // semver e.g. "1.0.2"
  string runtime_version = 2;  // rustc version e.g. "rustc 1.94.1"
  string os_kernel      = 3;  // e.g. "5.15.0-174-generic"
  int32  cpu_count      = 4;  // number of CPUs on this node
  google.protobuf.Timestamp started_at = 5;  // when this agent instance started

  // This cluster's CIDRs, so the CP can tell "peer in another of the
  // customer's clusters" from "external". Reported once at connect.
  string pod_cidr = 6;  // e.g. "10.42.0.0/16"
  string svc_cidr = 7;  // e.g. "10.43.0.0/16"
  int64  mem_total_bytes = 8;  // total node memory
  string arch            = 9;  // e.g. "aarch64"
}

// Control plane response to Connect.
// Agent should not send events until it receives this acknowledgement.

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  CLUSTER_ID_UNKNOWN        = 1;
  CLUSTER_DECOMMISSIONED    = 2;
  CLUSTER_LIMIT_REACHED     = 3;
  LICENSE_EXPIRED           = 4;
  CERTIFICATE_REVOKED       = 5;
}

message ConnectAck {
  bool   accepted       = 1;  // false means cluster_id rejected
  string message        = 2;  // human-readable reason if rejected
  string server_version = 3;  // control plane version
  RejectReason reject_reason = 4;  // structured reason when accepted=false
}

// Sent every AEGIS_CP_HEARTBEAT_INTERVAL_SECS (default 10).
// Control plane marks node offline if no heartbeat received within
// AEGIS_CP_HEARTBEAT_TIMEOUT_SECS (default 30).
message Heartbeat {
  google.protobuf.Timestamp timestamp    = 1;
  int32                     process_count = 2;  // current tracked process count
  uint64                    uptime_secs  = 3;   // agent uptime in seconds
  int32                     buffer_used = 4;
  int32                     buffer_cap  = 5;
}


// ── State snapshot ────────────────────────────────────────────────────────

// Full current state pushed on connect and reconnect.
// Allows the control plane to rebuild its view without loss.
// The control plane replaces all state for this node on receipt.
message StateSnapshot {
  google.protobuf.Timestamp  captured_at   = 1;
  repeated ServiceEdge       service_map   = 2;
  repeated PodSignals        signals       = 3;
  int32                      process_count = 4;
  repeated string         namespaces  = 5;
  repeated WorkloadStatus workloads   = 6;
}


// ── Service map ───────────────────────────────────────────────────────────

// A directed edge in the service dependency graph.
// Represents observed traffic from one Kubernetes entity to another.
message ServiceEdge {
  // Source endpoint
  string src_name        = 1;  // graph name (service name or pod name)
  string src_namespace   = 2;
  string src_owner_kind  = 3;  // Deployment, StatefulSet, DaemonSet
  string src_owner_name  = 4;
  string src_service_name = 5; // Kubernetes service name if resolved, empty otherwise

  // Destination endpoint
  string dst_name        = 6;
  string dst_namespace   = 7;
  string dst_owner_kind  = 8;
  string dst_owner_name  = 9;
  string dst_service_name = 10;

  // Traffic characteristics
  uint32 dst_port        = 11;
  uint32 proto           = 12; // 6=TCP, 17=UDP
  uint64 bytes_total     = 13;
  uint64 packets_total   = 14;

  // Timestamps
  google.protobuf.Timestamp first_seen_at = 15;
  google.protobuf.Timestamp last_seen_at  = 16;

  // Raw peer addressing — set when the destination did not resolve to a
  // local workload (cross-node, cross-cluster, or external peer). The CP
  // uses dst_ip to correlate against other nodes'/clusters' pod indexes,
  // or classify as external by port/proto.
  string src_ip     = 17;  // dotted IPv4, may be empty when resolved locally
  string dst_ip     = 18;  // dotted IPv4 of the unresolved peer
  string flow_class = 19;  // agent label: EAST_WEST, SERVICE, EXT_EGRESS, EXT_INGRESS, HOST_TRAFFIC

  // ── Two-sided edge health (4.5c) ─────────────────────────────────────────
  // Each agent contributes the half it can observe for this edge. The SOURCE's
  // agent fills src_view (its opened-side health dialing dst); the DEST's agent
  // fills dst_view (its accepted-side health receiving from src). The CP joins
  // the two half-edges on the canonical (src-identity, dst-identity) pair, so a
  // rendered edge can carry both. They need NOT agree: both-bad = peer-app
  // problem; src-bad/dst-fine = path/network problem; both-fine = healthy.
  EdgeHealthView src_view = 20;  // source's opened-side view of this edge
  EdgeHealthView dst_view = 21;  // destination's accepted-side view of this edge

  // ── L7 (phase a) ─────────────────────────────────────────────────────────
  // Optional HTTP metrics for this edge — latency + status-class counts. Set
  // only when the agent parsed HTTP on the edge; unset = no L7 observed (NOT a
  // health verdict). The CP merges l7 histograms across agents reporting the
  // same edge. See L7Stats.
  L7Stats l7 = 22;
}

// One endpoint's view of an edge's connection health. Failure ratio is the
// signal: (reset + handshake_fail) / attempt over the window.
message EdgeHealthView {
  bool   present        = 1;  // this side was observed (distinguishes "fine" from "unknown")
  Trend  attempt        = 2;
  Trend  established     = 3;
  Trend  reset          = 4;
  Trend  handshake_fail = 5;
}

// Incremental service map event — sent as changes happen.
message ServiceMapEvent {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EDGE_DISCOVERED        = 1;  // new edge seen for the first time
    EDGE_UPDATED           = 2;  // existing edge has new traffic
    EDGE_EVICTED           = 3;  // edge stale, removed from graph
  }

  EventType                 type      = 1;
  ServiceEdge               edge      = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// Batched incremental service-map changes. The agent coalesces one poll
// interval's edge updates/evictions into a single frame, bounding the message
// rate at scale to one frame per node per interval rather than one per edge.
message ServiceMapBatch {
  repeated ServiceMapEvent events = 1;
}


// ── CPU throttle ──────────────────────────────────────────────────────────

// ── Per-pod signals (CPU + memory; network later) ──────────────────────────

// Severity classification — shared by per-signal trends and the synthesized
// combined pod state.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  STABLE               = 1;
  WARNING              = 2;
  CRITICAL             = 3;
}

// Which dimension drove the combined state — drives the service-graph glyph.
enum DominantSignal {
  DOMINANT_SIGNAL_UNSPECIFIED  = 0;
  DOMINANT_SIGNAL_NONE         = 1;
  DOMINANT_SIGNAL_CPU          = 2;
  DOMINANT_SIGNAL_MEMORY       = 3;
  DOMINANT_SIGNAL_AVAILABILITY = 4;
  DOMINANT_SIGNAL_NETWORK      = 5;
}

// CPU throttle signal for one pod.
message CpuStats {
  Severity        trend          = 1;
  double          throttle_ratio = 2;  // 0.0–1.0, current window ratio
  // Last N window ratios for sparkline (most recent last, max 6).
  repeated double window_ratios  = 3;
  double warning_ratio  = 4;  // agent's WARNING threshold (e.g. 0.10)
  double critical_ratio = 5;  // agent's CRITICAL threshold (e.g. 0.25)
  // Pod CPU limit in millicores (sum of the pod's container cpu.max quotas).
  // 0 = unlimited (no cpu.max set on any container).
  uint32 limit_millicores = 6;
}

// Memory signal for one pod. All values read from the pod's cgroup v2 files.
message MemoryStats {
  Severity trend = 1;

  // PSI "some avg10": % of time tasks stalled on memory. Headline gauge.
  double          psi_some_avg10 = 2;
  // Windowed PSI for sparkline (most recent last), same cadence as cpu window.
  repeated double psi_window     = 3;

  // Working set vs limit: (memory.current - inactive_file) / memory.max.
  // ratio < 0 means no limit set (memory.max == "max").
  double working_set_ratio = 4;
  uint64 working_set_bytes = 5;  // for display, e.g. "412Mi"
  uint64 limit_bytes       = 6;  // 0 when unlimited

  uint32 oom_kill_delta = 7;  // memory.events oom_kill, delta since last report
  double majfault_rate  = 8;  // memory.stat pgmajfault, faults/sec
  // Windowed oom_kill delta, aligned 1:1 with psi_window (most recent last).
  repeated uint32 oom_window = 9;
}

// Availability signal for one pod — sourced from Kubernetes pod/container
// status, NOT the cgroup. Lets a pod that isn't running (CrashLoop, OOMKilled,
// NotReady, Pending) report as unhealthy instead of vanishing from the graph.
message AvailabilityStats {
  Severity trend         = 1;
  string   reason        = 2;  // "", "OOMKilled", "CrashLoopBackOff", "NotReady", "Pending", "ImagePullBackOff", "Error"
  uint32   restart_count = 3;
  bool     ready         = 4;  // pod's Ready condition
}

// File-descriptor pressure for one pod — process-wide (sockets AND files),
// summed over the pod's container pids, divided by the RLIMIT_NOFILE soft
// ceiling. Not per-protocol. Read from /proc, no eBPF. Utilization = open /
// ceiling; the agent's warning/critical ratios are carried so the UI can shade
// zones without an opinionated verdict.
message FdStats {
  uint64 open           = 1;  // summed open fds across the pod's pids
  uint64 ceiling        = 2;  // RLIMIT_NOFILE soft (min across pids); 0 = unknown
  double warning_ratio  = 3;  // agent WARNING threshold on open/ceiling
  double critical_ratio = 4;  // agent CRITICAL threshold on open/ceiling
}

// Current value plus its co-sampled window (aligned to the CPU/mem window cadence).
message Trend {
  double current = 1;
  repeated double window = 2;
}

enum L4Protocol {
  L4_PROTOCOL_UNSPECIFIED = 0;
  TCP  = 1;
  UDP  = 2;
  ICMP = 3;
}

// Application-layer protocol the agent parsed on an edge. HTTP1 is all phase-a
// captures; HTTP2/GRPC are reserved for later (they need HPACK-aware parsing).
enum L7Protocol {
  L7_PROTOCOL_UNSPECIFIED = 0;
  HTTP1 = 1;
  HTTP2 = 2;  // reserved — not emitted yet
  GRPC  = 3;  // reserved — not emitted yet
}

// Network activity for one pod, one protocol. Rates are bytes/sec, computed by
// the agent from the flow map (deltas ÷ flow poll interval), windowed like
// cpu/memory. Activity only — no health verdict here.
message NetworkStats {
  L4Protocol protocol                    = 1;
  double ingress_bps                     = 2;
  double egress_bps                      = 3;
  double avg_packet_size                 = 4;
  repeated double ingress_window         = 5;
  repeated double egress_window          = 6;
  repeated double avg_packet_size_window = 7;

  // --- Part two: connection health (TCP) ---
  // Census
  Trend established_opened               = 8;
  Trend established_accepted             = 9;
  Trend in_progress_opened               = 10;
  Trend in_progress_accepted             = 11;
  Trend stuck_handshake_opened           = 12;  // outbound dials past timeout = dependency dark
  Trend stuck_handshake_accepted         = 13;  // inbound half-opens past timeout = SYN-flood / failing clients

  // Failure rates (per interval)
  Trend reset_opened                     = 14;  // resets on my outbound = a dependency reset me
  Trend reset_accepted                   = 15;  // resets I sent to inbound clients
  Trend handshake_fail_opened            = 16;  // my dials that never established
  Trend handshake_fail_accepted          = 17;
  Trend graceful_close                   = 18;  // context

  // Latency / path health (aggregate)
  Trend connect_latency_p50_ms           = 19;
  Trend connect_latency_p99_ms           = 20;
  Trend srtt_ms                          = 21;
  Trend retransmit_rate                  = 22;

  // --- Part three: network health verdict ---
  Severity trend                         = 23;

  Trend accept_rate                      = 24;
  double throughput_baseline             = 25;
  double accepted_bps                    = 26;
  double opened_bps                      = 27;
  double accepted_baseline               = 28;

  repeated PerPeerHealth peer_health     = 29;
  repeated double accepted_window        = 30;
  repeated double opened_window          = 31;

  // Socket-fd exhaustion: rate of EMFILE/ENFILE on socket allocation (per-sec,
  // windowed). Non-zero = this pod is out of socket file descriptors — the
  // kernel-level fingerprint of held-connection resource exhaustion.
  Trend fd_fail                          = 32;

  // Process/thread (PID) saturation: the pod cgroup's pids.current ÷ pids.max,
  // windowed (0..1). A finite exhaustible per-pod resource like fd — a value
  // near 1 means the pod is about to fail fork()/pthread_create() with EAGAIN.
  // 0 when pids.max is unlimited/unknown. Feeds the "is the pod in stress" gate.
  Trend pid_util                         = 33;

  // Ephemeral-port (source-port) exhaustion: per-sec rate of connect()
  // EADDRNOTAVAIL failures, from the eBPF sys_exit_connect probe. Non-zero means
  // the pod is out of ephemeral source ports to some destination (TIME_WAIT
  // pileup / unpooled client). A per-pod (per-netns) resource. Feeds step (a).
  Trend ephemeral_port_fail              = 34;

  // Raw PID/thread counts for display, reported EVERY poll (unlike pid_util,
  // which is only meaningful when a limit exists). pid_max = 0 means the cgroup
  // pids controller is unlimited ("max") — the pod still shows a current count
  // with "no limit", like memory does.
  uint64 pid_current                     = 35;  // cgroup pids.current
  uint64 pid_max                         = 36;  // cgroup pids.max; 0 = unlimited

  // RST initiator split. reset_opened (14) / reset_accepted (15) remain the
  // TOTALS (an RST seen on the connection, whichever end sent it); these carry
  // the SELF-initiated subset (peer-initiated = total − self). The split is
  // what separates wait-shaped from failure-shaped trouble on the accepted
  // side: callers resetting connections INTO me = callers giving up on a slow
  // server (SLOW_SERVING evidence); me resetting my accepted connections = I
  // am failing my callers (INTERNAL_FAULT evidence). Opened side mirrors it:
  // me resetting my own dials = my client timeout abandoned a slow downstream.
  Trend reset_opened_self                = 37;  // RSTs I sent on connections I dialed
  Trend reset_accepted_self              = 38;  // RSTs I sent on connections I accepted

  // Wait-shaped serving signal: request→response latency this pod serves on
  // its ACCEPTED (inbound) HTTP edges, pooled across callers, with an
  // agent-learned stable-gated baseline (same EWMA statistic as the throughput
  // baselines; learned only while the pod is STABLE and actually serving, so
  // the anomaly it is meant to expose can never drag it up). This is the
  // signal that lets a slow-but-succeeding server promote to stress while its
  // resources sit at baseline and no caller has failed yet. baseline 0 =
  // unseeded — consumers must treat the ratio as unjudgeable, never as fine.
  Trend  serve_latency_ms                = 39;  // windowed p50 serving latency, ms
  double serve_latency_baseline_ms       = 40;  // stable-gated EWMA baseline; 0 = unseeded
  Trend  serve_request_rate              = 41;  // matched request→response pairs per second
}

// ── L7 (application layer) ────────────────────────────────────────────────
//
// Optional HTTP metrics for one edge, aggregated over the reporting window.
// ENTIRELY OPTIONAL at every layer: the agent sets it only when it actually
// parsed HTTP on the edge (plaintext off the wire in phase a); absence means
// "no L7 observed", never "healthy" — consumers must render nothing when it is
// unset and must never fail on its absence.
//
// Phase a is per-EDGE only — no per-path/per-operation breakdown (that is
// phase c, and is what keeps cardinality bounded here). Counts are for the
// window the parent message covers; the CP sums them across contributing
// agents/pods for the same logical edge.
//
// Latency is carried as a HISTOGRAM, not precomputed percentiles, because
// percentiles are not summable across contributors — the CP merges buckets from
// every agent reporting this edge and derives p50/p95/p99 from the merged
// histogram. The buckets are BASE-2 LOG over nanoseconds (see latency_log2_ns),
// so a fast (µs) edge and a slow (s) edge both get real resolution — there is no
// hardcoded ladder to be arbitrary at the wrong scale. The CP interpolates
// within the bucket for the percentile value.
message L7Stats {
  L7Protocol protocol   = 1;   // HTTP1 in phase a

  uint64 requests       = 2;   // HTTP requests observed on this edge, this window
  uint64 responses      = 3;   // responses matched to a request (completion visibility)

  // Response status-class counts, this window. A request with no matched
  // response contributes to `requests` but to none of these (in-flight/dropped).
  uint64 status_2xx     = 4;
  uint64 status_3xx     = 5;
  uint64 status_4xx     = 6;   // client errors
  uint64 status_5xx     = 7;   // server errors — the headline L7 failure signal

  // Request→response latency histogram, SCALE-INVARIANT: bucket i counts samples
  // whose latency in nanoseconds has floor(log2(ns)) == i — i.e. latency in
  // [2^i, 2^(i+1)) ns. Base-2 log buckets so the resolution follows the data at
  // any scale (µs, ms, s) instead of a fixed ladder, and the CP derives real
  // percentiles by interpolating WITHIN the bucket (not reporting a bucket edge).
  // Summable across contributing agents/pods (add bucket-wise). Index 0 = <2ns.
  repeated uint64 latency_log2_ns = 8;

  // Request rate sparkline (req/sec, most recent last), aligned to the same
  // window cadence as the cpu/mem/network sparklines.
  repeated double request_window    = 9;

  // Exponent of bucket 0 in latency_log2_ns, so the histogram DESCRIBES ITS OWN
  // scale instead of relying on both ends agreeing a constant. bucket i counts
  // latency in [2^(floor+i), 2^(floor+i+1)) ns.
  //
  // 0 (or absent, from an agent predating this field) = the original ladder
  // starting at 1ns. Agents that drop the sub-microsecond buckets — no HTTP or
  // datastore round trip can complete in under 1µs, so those ten buckets never
  // received a sample — send floor=10, making bucket 0 "<=1µs".
  //
  // Explicit rather than implied because a rolling agent upgrade has both
  // versions reporting at once, and a silently mis-scaled histogram is off by
  // 1024x — the kind of error that poisons an analytics/ML store invisibly.
  uint32 latency_log2_floor = 11;

  // Per-HTTP-method breakdown, CALLER (opened) side only — the basis for the
  // per-operation completion rate (2xx ÷ requests sent) in phase c.1. One entry
  // per method actually seen on the edge; bounded by the fixed method set. Routes
  // are aggregated here (c.1); c.2 adds the per-route split. Empty on the accepted
  // (server) side and when no HTTP was parsed.
  repeated MethodStat methods       = 10;
}

// HTTP request method. Bounded set the agent's strict request-line parser
// recognises; anything else is not counted as a request at all.
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET         = 1;
  HTTP_METHOD_POST        = 2;
  HTTP_METHOD_PUT         = 3;
  HTTP_METHOD_HEAD        = 4;
  HTTP_METHOD_DELETE      = 5;
  HTTP_METHOD_PATCH       = 6;
  HTTP_METHOD_OPTIONS     = 7;
}

// One HTTP method's request/response tally on an edge, this window, caller side.
// responses = status_2xx+3xx+4xx+5xx; a request with no matched response
// (unanswered = requests − responses) is a non-completion. Completion rate =
// status_2xx ÷ requests. Per-method latency is deferred to c.2.
message MethodStat {
  HttpMethod method  = 1;
  uint64 requests    = 2;
  uint64 status_2xx  = 3;
  uint64 status_3xx  = 4;
  uint64 status_4xx  = 5;
  uint64 status_5xx  = 6;

  // Per-ROUTE breakdown of this method (phase c.2), CALLER side. The agent
  // templates the path (variable segments → ":id") and strips the query string,
  // so /abc/123 and /abc/989?x=1 collapse to one route "/abc/:id". Bounded by
  // top-N + an "other" bucket for the tail (route == "other"). Empty until c.2.
  repeated RouteStat routes = 7;
}

// One templated route's request/response tally for a method, this window, caller
// side. Same completion math as MethodStat (status_2xx ÷ requests), scoped to a
// single route. route is the templated path ("/inventory/:id"); the tail bucket
// is the literal "other".
message RouteStat {
  string route       = 1;
  uint64 requests    = 2;
  uint64 status_2xx  = 3;
  uint64 status_3xx  = 4;
  uint64 status_4xx  = 5;
  uint64 status_5xx  = 6;

  // Latency over matched request→response pairs only (a request with no
  // response contributes to `requests` but to neither of these), nanoseconds.
  //
  // lat_sum_ns is WINDOWED like every other counter here, so mean =
  // lat_sum_ns ÷ matched-count is this window's mean and is summable across
  // agents. lat_max_ns is CUMULATIVE — the worst round trip seen on this route
  // since the agent first saw the edge, not a per-window maximum. A windowed
  // max cannot be derived by subtraction, and resetting the kernel counter
  // from userspace would race the data path for a statistic that is only a
  // bimodality hint; the mean is the number that drives comparison.
  //
  // Deliberately NOT a histogram. A single route sees a small fraction of its
  // edge's traffic — often a handful of samples per window — where a percentile
  // is indistinguishable from the maximum, and a per-route histogram would cost
  // ~5MiB of preallocated kernel memory to say what 16 bytes says here. The
  // edge keeps the full histogram, where sample counts make percentiles real;
  // these answer the different question "WHICH call on that edge is slow".
  uint64 lat_sum_ns  = 7;
  uint64 lat_max_ns  = 8;
}

// Per-peer connection health for ONE direction toward ONE peer. The agent emits
// these for both directions: opened (peer = a downstream I call) and accepted
// (peer = a caller of me). dst_ip is the peer's address in both cases (the
// downstream for opened, the caller for accepted). Identity is resolved to the
// peer's canonical graph identity + workload type so the CP can join the two
// half-edges (my opened-side to X, X's accepted-side from me) on (src,dst).
message PerPeerHealth {
  string dst_ip                = 1;  // peer IPv4 (downstream for opened, caller for accepted)
  string peer_name             = 2;  // resolved graph name, "" if external/unresolved
  string peer_namespace        = 3;
  // Tags 4,5 retained for wire back-compat with older agents (opened-only).
  // New agents populate the direction-agnostic fields below instead.
  Trend  reset_opened          = 4 [deprecated = true];
  Trend  handshake_fail_opened = 5 [deprecated = true];

  uint32 direction             = 6;  // 0 = opened (I dial peer), 1 = accepted (peer dials me)
  string peer_type             = 7;  // workload kind: Deployment, StatefulSet, DaemonSet, External

  // Ratio inputs — failure % = (reset + handshake_fail) / attempt. Magnitude
  // alone is meaningless; the denominator makes "5/5 failing" vs "5/5000" distinct.
  Trend  attempt               = 8;  // connection attempts to/from this peer, per-sec windowed
  Trend  established           = 9;  // attempts that reached ESTABLISHED
  Trend  reset                 = 10; // RST, per-sec windowed
  Trend  handshake_fail        = 11; // closed before established, per-sec windowed
  Trend established_held       = 12;
  Trend graceful_close         = 13;  // graceful (FIN) closes to/from this peer, per-sec windowed

  // Per-peer throughput split by DATA direction (not connection direction).
  // bytes_sent = local→peer, bytes_recv = peer→local, both per-sec windowed.
  // Together they carry the "sending but nothing coming back" fingerprint of a
  // hung downstream, and back the merged/directional per-edge throughput view.
  // The pod-level accepted_bps/opened_bps stay the exact aggregate; these
  // attribute throughput to the specific edge.
  Trend bytes_sent             = 14;
  Trend bytes_recv             = 15;

  // Learned per-peer, per-direction throughput baselines (bytes/sec). Computed by
  // the SAME stable-gated EWMA the pod-level throughput_baseline/accepted_baseline
  // use, but keyed to THIS peer so "current vs baseline" is measured against the
  // right resting floor — the pod-level baseline is the wrong granularity for
  // attributing which edge moved. bytes_sent_baseline pairs with bytes_sent
  // (local→peer), bytes_recv_baseline with bytes_recv (peer→local). Zero until
  // enough STABLE samples have been learned for this peer.
  double bytes_sent_baseline   = 16;
  double bytes_recv_baseline   = 17;

  // Optional HTTP metrics for this specific peer edge — backs the L7 view in the
  // pod-detail network tab. Same optional/graceful contract as ServiceEdge.l7:
  // set only when HTTP was parsed for this peer, unset otherwise. See L7Stats.
  L7Stats l7                   = 18;

  // Optional datastore metrics for this specific peer edge — set only when the
  // peer speaks a recognized DB/cache wire protocol AND that protocol's parsing
  // is enabled on the agent, unset otherwise. Caller (opened) side only — the
  // sender view of MY calls to MY datastore, mirroring L7Stats.methods. See
  // DbStats.
  DbStats db                   = 19;
}

// Datastore wire protocols the agent can parse. The contract is deliberately
// GENERIC: DbStats/DbOpStat carry (protocol, operation string, outcome counts),
// so supporting a new datastore is a new enum value here plus an agent parser —
// no schema change, non-breaking in v1. Values are also the unit of per-tenant
// entitlement (a protocol can be licensed/enabled independently).
enum DbProtocol {
  DB_PROTOCOL_UNSPECIFIED = 0;
  DB_REDIS                = 1;  // RESP (Redis Serialization Protocol)
  DB_POSTGRES             = 2;  // reserved — not emitted yet
  DB_MYSQL                = 3;  // reserved — not emitted yet
  DB_MONGODB              = 4;  // reserved — not emitted yet
}

// Per-operation datastore tallies for one peer edge, this window — the basis
// for per-operation completion (ok ÷ requests), caller POV. Operations are the
// protocol's AGGREGATE verbs (GET, SET, HGET… for Redis; SELECT, INSERT… for
// SQL later), never individual queries/keys — bounded top-N with the tail
// summed into "other".
message DbOpStat {
  string op       = 1;  // normalized operation name, uppercase; "other" = tail
  uint64 requests = 2;  // operations sent this window
  uint64 ok       = 3;  // non-error replies matched (a nil/empty result is ok)
  uint64 errors   = 4;  // protocol-level error replies (e.g. RESP "-ERR …")
  uint64 no_reply = 5;  // request whose connection closed before any reply

  // Query latency over replies actually matched to their request (ok + errors;
  // never no_reply), nanoseconds. Same shape and caveat as RouteStat:
  // lat_sum_ns is windowed (mean = sum ÷ matched count), lat_max_ns is the
  // cumulative worst since the edge was first seen. Counters rather than a
  // histogram because the question at operation level is which query is slow,
  // not the tail shape of one query.
  //
  // Measured from the request write to its matched reply, so it is the
  // client-observed round trip — network plus server time — which is what the
  // calling pod actually waits on.
  uint64 lat_sum_ns = 6;
  uint64 lat_max_ns = 7;
}

// Datastore metrics for one peer edge, this window. One protocol per edge (a
// given peer speaks one wire protocol); repeated ops bounded by top-N + "other".
message DbStats {
  DbProtocol protocol = 1;
  repeated DbOpStat ops = 2;
  // Edge-level operation rate this window (ops/sec), agent-computed like every
  // other rate — the CP never re-derives rates from counts.
  double ops_per_sec = 3;
}

// Current signal state for one pod — CPU + memory + the synthesized verdict.
message PodSignals {
  // Kubernetes identity
  string pod_name     = 1;
  string namespace    = 2;
  string owner_kind   = 3;
  string owner_name   = 4;
  string service_name = 5;  // empty if not behind a service
  string pod_ip       = 6;
  string node_name    = 7;
  google.protobuf.Timestamp last_updated_at = 8;

  // Per-dimension signals.
  CpuStats    cpu    = 9;
  MemoryStats memory = 10;
  AvailabilityStats availability = 13;


  // Synthesized state = worst-of(cpu, memory, availability), escalated to
  // CRITICAL when two or more dimensions are >= WARNING. Drives the pod dot and
  // (with workload capacity) the service-graph node colour.
  Severity       state    = 11;
  DominantSignal dominant = 12;  // which dimension drove `state`
  repeated NetworkStats network = 14;
  FdStats        fd       = 15;  // process-wide file-descriptor pressure (display)

  // Per-container CPU limits for this pod. Kubernetes limits are a per-container
  // field (there is no pod-level limit — cpu.limit_millicores above is the sum),
  // so remediation needs the breakdown to raise the RIGHT container off ITS own
  // limit. Lets the control plane build the remediation recommendation without
  // reading the kube API.
  repeated ContainerCpu containers = 16;
}

// One container's CPU limit, as set on the pod spec (resources.limits.cpu).
message ContainerCpu {
  string name                 = 1;
  uint32 cpu_limit_millicores = 2;  // 0 = no limit set (nothing to raise)
}

// Incremental signal event — sent on combined-state change, any per-dimension
// trend change, or as a periodic heartbeat. Replaces ThrottleEvent.
message SignalEvent {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    STATE_CHANGED          = 1;  // combined state transitioned
    STATE_RESOLVED         = 2;  // combined state returned to STABLE
    SNAPSHOT               = 3;  // periodic full state for all pods on this node
    POD_GONE               = 4;  // pod's last process exited; evict state
    STATE_UPDATE           = 5;  // periodic report, no transition
  }

  EventType                 type           = 1;
  PodSignals                state          = 2;
  Severity                  previous_state = 3;  // combined state before this event
  google.protobuf.Timestamp occurred_at    = 4;
}

// Per-workload capacity — desired vs ready replicas. Authoritative source for
// "is the service at full strength," independent of how hard individual pods
// are working. Read from the owning Deployment/StatefulSet/DaemonSet spec+status.
message WorkloadStatus {
  string   namespace    = 1;
  string   name         = 2;  // workload (owner) name
  string   kind         = 3;  // Deployment, StatefulSet, DaemonSet
  string   service_name = 4;  // resolved Service, if any — for graph node keying
  uint32   desired      = 5;
  uint32   ready        = 6;
  uint32   available    = 7;
  Severity availability = 8;  // STABLE when ready==desired; else WARNING/CRITICAL by gap
}

// Incremental workload-capacity change. Low churn, so sent on-change.
message WorkloadEvent {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    WORKLOAD_UPDATED       = 1;
    WORKLOAD_REMOVED       = 2;
  }
  EventType                 type        = 1;
  WorkloadStatus            workload    = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// ── Config update (control plane → agent) ────────────────────────────────

// Reserved for future use — allows the control plane to push
// configuration updates to agents without requiring a restart.
// Not implemented in v1 agent but defined here for forward compatibility.
message ConfigUpdate {
  // Polling intervals (seconds). 0 means keep current value.
  uint32 throttle_poll_secs      = 1;
  uint32 flow_poll_secs          = 2;
  uint32 heartbeat_interval_secs = 3;

  // Throttle thresholds. 0.0 means keep current value.
  double throttle_warning_ratio  = 4;
  double throttle_critical_ratio = 5;

  bool decommissioned = 6;

  // Memory thresholds (0 = keep current). Forward-compat only in v1.
  double mem_psi_warning_pct   = 7;
  double mem_psi_critical_pct  = 8;
  double mem_ws_warning_ratio  = 9;
  double mem_ws_critical_ratio = 10;
}


// ── RPC service definition ────────────────────────────────────────────────

service AegisAgent {
  // The primary stream. Agent opens this on startup and keeps it open.
  // Agent sends AgentMessage, control plane sends ControlPlaneMessage.
  // mTLS provides authentication at the transport layer.
  // cluster_id in AgentMessage provides application-layer validation.
  rpc OpenStream(stream AgentMessage) returns (stream ControlPlaneMessage);

  // The control stream. A SECOND agent-initiated bidirectional stream, opened
  // over the same mTLS connection and kept open alongside OpenStream, dedicated
  // to control operations (CP -> agent commands, agent -> CP results). Telemetry
  // and control are kept on separate streams so each can fail, reconnect, and be
  // reasoned about independently; a future release may split control into its
  // own service. The agent actuates commands in-cluster with its own
  // ServiceAccount (the CP holds no kubeconfig), so this works identically
  // whether the kube API server is on a node or a managed control plane.
  rpc OpenControlStream(stream ControlUp) returns (stream ControlDown);
}

// ── Resolution feeds (A0: cross-cluster correlation bedrock) ───────────────
// The CP joins cross-cluster half-edges by destination identity. Because a
// cross-cluster source dials a Service VIP / LB / ingress IP — not the dst
// pod IP — the raw-IP join used for cross-node doesn't carry across clusters.
// These two feeds let the CP build a fleet-wide IP->identity and name->identity
// index ahead of time, so an arriving half-edge resolves by lookup.

// PRIMARY feed. The cluster's externally-reachable endpoints mapped to the
// workload behind them. Low churn (Services/Ingress turn over far less than
// pods), so sent on-change / low-frequency — NOT in the flow batch.
message EndpointAdvertisement {
  google.protobuf.Timestamp captured_at = 1;

  // Full set of this cluster's externally-reachable endpoints this cycle.
  // The CP treats each advertisement as the authoritative set for the
  // sending cluster and reconciles (adds new, evicts missing).
  repeated ServiceEndpoint endpoints = 2;
}

// One externally-reachable endpoint -> backing workload identity.
message ServiceEndpoint {
  // Reachable address a cross-cluster source would dial.
  string address = 1;   // dotted IPv4: LB ingress IP, ingress host IP, or node IP (NodePort)
  uint32 port    = 2;   // service / nodePort
  uint32 proto   = 3;   // 6=TCP, 17=UDP

  EndpointKind kind = 4;

  // Backing workload identity (what the resolved edge dst should become).
  string service_name = 5;
  string namespace    = 6;
  string owner_kind   = 7;  // Deployment, StatefulSet, DaemonSet
  string owner_name   = 8;

  // DNS name(s) this endpoint is exposed under, when known (ingress host,
  // service FQDN). Feeds the name index; lets a DnsObservation join here.
  repeated string dns_names = 9;
}

enum EndpointKind {
  ENDPOINT_KIND_UNSPECIFIED = 0;
  LOAD_BALANCER             = 1;  // Service type=LoadBalancer ingress IP
  INGRESS                   = 2;  // Ingress host/IP
  reserved 3;                     // reserved for NODE_PORT
}

// SECONDARY feed. A DNS resolution observed from a source pod — the name it
// dialed and the IP it got back. Fills what advertisement can't (name-only /
// external targets) and confirms intent. Best-effort: absent under DoT/DoH,
// IP-literal dials, and pre-watch cached connections.
message DnsObservation {
  string src_namespace = 1;  // querying pod's namespace
  string src_pod       = 2;  // querying pod
  string query_name    = 3;  // name resolved, e.g. "inventory.demo.svc.cluster.local" or an ingress host
  string resolved_ip   = 4;  // dotted IPv4 the name resolved to
  google.protobuf.Timestamp observed_at = 5;
}


// ═══════════════════════════════════════════════════════════════════════════
// Control channel (OpenControlStream)
//
// A second agent-initiated bidirectional stream, separate from the telemetry
// stream, carrying control operations. The agent executes each command against
// the kube API server using its OWN in-cluster ServiceAccount — the CP holds no
// kubeconfig and needs no path to the cluster. Today it carries the demo
// CPU/memory squeeze; remediation and the other controls will ride the same
// channel later.
// ═══════════════════════════════════════════════════════════════════════════

// Agent -> control plane on the control stream.
message ControlUp {
  oneof payload {
    ControlHello       hello              = 1;  // first message after the stream opens
    DemoCommandResult  demo_result        = 2;  // reply to a DemoCommand
    RemediationResult  remediation_result = 3;  // reply to a RemediationCommand
  }
}

// Control plane -> agent on the control stream.
message ControlDown {
  oneof payload {
    DemoCommand        demo_command        = 1;
    RemediationCommand remediation_command = 2;
    EntitlementUpdate  entitlement_update  = 3;
  }
}

// The tenant's licensed machinery capabilities, pushed by the control plane
// right after the control stream registers and again whenever the tenant's
// license changes (upsell, renewal, expiry) — entitlement changes reach the
// node live, with no agent or CP restart. Capabilities are namespaced feature
// strings RESOLVED CP-side from the license ("db:redis", "db:*",
// "transport:*", ...): the agent never re-implements licensing policy, it
// arms exactly the machinery the set covers (unentitled machinery is never
// armed — zero kernel cost on the customer's node) and treats its own local
// configuration as an opt-DOWN within this ceiling. An agent that has never
// received one (older control plane) behaves as before: local configuration
// only.
message EntitlementUpdate {
  repeated string capabilities = 1;
}

// An approved remediation to apply in-cluster: raise specific containers' CPU
// limits. Unlike DemoCommand (one value across a selector), each target names an
// exact pod+container and its own new limit, so only the throttling containers
// are touched and each is sized from its own limit.
message RemediationCommand {
  string request_id             = 1;   // correlates the RemediationResult
  string namespace              = 2;
  repeated ResizeTarget targets = 3;
}

// One container to resize and the CPU limit to set on it (a Kubernetes quantity,
// e.g. "350m").
message ResizeTarget {
  string pod       = 1;
  string container = 2;
  string cpu       = 3;
}

// Per-target result of a RemediationCommand.
message RemediationResult {
  string request_id               = 1;
  repeated TargetOutcome outcomes = 2;
}

message TargetOutcome {
  string pod       = 1;
  string container = 2;
  bool   ok        = 3;
  string detail    = 4;  // applied-limit summary on success, or the error on failure
}

// First message the agent sends on the control stream so the CP can register
// this node's stream in its send registry (keyed customer -> cluster -> node).
// The customer is taken from the mTLS client-cert OU, as on the telemetry stream.
message ControlHello {
  string cluster_id = 1;
  string node_name  = 2;
}

// A demo/debug actuation the CP asks the agent to apply in-cluster. The target
// is one pod, a whole service's pods, or every workload in the namespace
// (mutually exclusive), optionally narrowed to a single container. The agent
// resolves the target to live pods/containers and applies the action via the
// pods/resize subresource.
message DemoCommand {
  string request_id = 1;   // correlates the DemoCommandResult
  string namespace  = 2;
  string service    = 3;   // set exactly one of service / pod / all
  string pod        = 4;
  bool   all        = 5;
  string container  = 6;   // optional; empty = every container of each pod

  oneof action {
    CpuLimit cpu = 7;
    MemLimit mem = 8;
  }
}

// Set an absolute CPU limit on each targeted container (a Kubernetes quantity,
// e.g. "250m").
message CpuLimit {
  string cpu = 1;
}

// Set a memory limit as a percentage of each targeted POD's current working set
// (>100 = pressure, <100 = OOM). The working sets are supplied by the CP (which
// aggregates them from all agents' telemetry), so a single agent can size the
// squeeze for the whole cluster without per-node data. pod_working_set maps pod
// name -> current working-set bytes; a pod absent from the map is skipped.
message MemLimit {
  double pct = 1;
  map<string, uint64> pod_working_set = 2;
}

// Result of applying a DemoCommand. updated/skipped are "pod/container" (CPU) or
// "pod/container=limit" (memory) strings, mirroring the REST response the iOS
// app already renders. error is set only when the whole command failed.
message DemoCommandResult {
  string request_id       = 1;
  repeated string updated = 2;
  repeated string skipped = 3;
  string error            = 4;
}
